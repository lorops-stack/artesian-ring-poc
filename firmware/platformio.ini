; Artesian Ring PoC firmware
; Board: ESP32-S3-N8R2 (8 MB flash, 2 MB quad PSRAM)
;   Build and upload:       pio run -t upload
;   Upload Ring Studio:     python ../tools/build_ui.py   then  pio run -t uploadfs
;   Tests without hardware: pio test -e native
; Library versions are minimums; the exact versions from the first good Phase 0
; build get pinned here with "@ x.y.z".

[platformio]
default_envs = esp32s3
data_dir = ../ui/dist-fs

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv   ; two app slots (OTA, F18) + LittleFS for the UI
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_qspi  ; N8R2 = quad-SPI flash and PSRAM
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17                ; the Arduino core defaults to gnu++11; lib/core and the sources use C++14/17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 921600
monitor_filters = default, esp32_exception_decoder
upload_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.2.0
; XM125: own register-level driver in lib/xm125 (two TwoWire buses).
; SparkFun's "SparkFun Qwiic XM125" library is the reference for the register map.

[env:native]
; lib/core (geometry, config, state machine) is plain C++ with no Arduino headers. ArduinoJson builds on the host too.
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNITY_INCLUDE_DOUBLE
build_src_filter = -<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
lib_ldf_mode = deep
