<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-label="Three XM125 wiring to ESP32-S3"><style>text{font-family:Arial,sans-serif;fill:#173144;font-size:18px}.title{font-size:30px;font-weight:bold}.small{font-size:16px}.box{fill:#f0f6fa;stroke:#8ca6b8;stroke-width:2}</style><rect width="1200" height="920" fill="white"/><text x="45" y="50" class="title">Three XM125s · one ESP32-S3-N8R2</text><text x="45" y="82">Point-to-point signal wiring · board labels, not header positions</text><rect x="50" y="140" width="310" height="540" rx="15" class="box"/><text x="80" y="180" class="title">ESP32-S3</text><text x="80" y="210">Power through USB</text>
<rect x="730" y="222" width="400" height="122" rx="12" class="box"/><text x="750" y="247" style="font-weight:bold">XM125 A · 0x52</text>
<text x="235" y="275">GPIO 8</text><path d="M360 270 H730" stroke="#007f99" stroke-width="3"/><text x="750" y="275">SDA</text>
<text x="235" y="303">GPIO 9</text><path d="M360 298 H730" stroke="#007f99" stroke-width="3"/><text x="750" y="303">SCL</text>
<text x="235" y="331">GPIO 6</text><path d="M360 326 H730" stroke="#007f99" stroke-width="3"/><text x="750" y="331">RST</text>
<rect x="730" y="362" width="400" height="122" rx="12" class="box"/><text x="750" y="387" style="font-weight:bold">XM125 B · 0x52</text>
<text x="235" y="415">GPIO 17</text><path d="M360 410 H730" stroke="#c06a16" stroke-width="3"/><text x="750" y="415">SDA</text>
<text x="235" y="443">GPIO 18</text><path d="M360 438 H730" stroke="#c06a16" stroke-width="3"/><text x="750" y="443">SCL</text>
<text x="235" y="471">GPIO 7</text><path d="M360 466 H730" stroke="#c06a16" stroke-width="3"/><text x="750" y="471">RST</text>
<rect x="730" y="502" width="400" height="122" rx="12" class="box"/><text x="750" y="527" style="font-weight:bold">XM125 C · 0x52</text>
<text x="235" y="555">GPIO 10</text><path d="M360 550 H730" stroke="#7852a8" stroke-width="3"/><text x="750" y="555">SDA</text>
<text x="235" y="583">GPIO 11</text><path d="M360 578 H730" stroke="#7852a8" stroke-width="3"/><text x="750" y="583">SCL</text>
<text x="235" y="611">GPIO 12</text><path d="M360 606 H730" stroke="#7852a8" stroke-width="3"/><text x="750" y="611">RST</text>
<text x="390" y="230" class="small">A: controller 0</text><text x="390" y="655" class="small">B/C: controller 1 switches pins in software</text><rect x="50" y="715" width="1080" height="110" rx="12" class="box"/><text x="75" y="745" style="font-weight:bold">POWER DISTRIBUTION · independent of the signal pairs above</text><text x="75" y="775">Regulated +5 V sensor supply → A VU/VUSB + B VU/VUSB + C VU/VUSB</text><text x="75" y="805">Supply GND → A GND + B GND + C GND + ESP32 GND</text><text x="50" y="860" class="small">Leave sensor 3V3 pins unconnected in this power scheme. Never put 5 V on data or reset.</text><text x="50" y="888" class="small">WU closed · onboard pull-ups enabled · separate data pairs · no sensor USB power while VU is fed.</text></svg>