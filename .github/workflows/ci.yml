name: firmware-and-ui
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript regression tests
        run: node --test ui/test/*.test.js
      - name: Build Ring Studio filesystem
        run: python3 tools/build_ui.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install "platformio==6.1.18"
      - name: Native core tests
        working-directory: firmware
        run: pio test -e native
      - name: XM125 register-driver host tests
        run: bash tools/xm125_host_test.sh
      - name: Compile exact ESP32-S3 target
        working-directory: firmware
        run: pio run -e esp32s3
